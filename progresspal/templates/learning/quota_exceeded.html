{% extends "base.html" %} {% load static %}

{% block title %}今日學習額度已滿{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
    <div class="text-center p-5 rounded shadow bg-white" style="max-width: 500px;">
        <span class="material-symbols-outlined text-warning mb-3" style="font-size: 64px;">
            hourglass_empty
        </span>

        <a href="{% url 'homepage' %}" class="btn btn-primary px-4 py-2">
