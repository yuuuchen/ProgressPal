<!-- base_scroll.html -->
{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant" class="h-100">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <!-- icon & CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/global_scroll.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column vh-100 m-0 p-0">
    {% include "includes/header.html" %}

    <div class="main-content flex-grow-1 overflow-y-auto">
        
        <div class="container py-4">
            {% block content %}{% endblock %}
        </div>
    </div>
    <footer class="footer bg-dark text-white text-center py-3 w-100">
        <div class="container">
            <p class="mb-0">&copy; 2025 ProgressPal Team. All Rights Reserved.</p>
        </div>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
