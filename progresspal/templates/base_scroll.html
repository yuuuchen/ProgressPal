<!-- base_scroll.html -->
{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant" class="h-100">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <!-- icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/global_scroll.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">
    {% include "includes/header.html" %}

    <div class="main-content flex-grow-1 overflow-y-auto" style="min-height: 0;">
        
        <div class="container py-4">
            {% block content %}{% endblock %}
        </div>
    </div>
        <footer class="footer bg-dark text-white text-center py-3">
            <div class="container">
                <p class="mb-0">&copy; 2025 ProgressPal Team. All Rights Reserved.</p>
            </div>
        </footer>
    

    {% block scripts %}{% endblock %}
</body>
</html>
