<!-- base_accounts.html -->
 {% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    {% block head_extension %}{% endblock %}
</head>
<!-- 1. body 使用 min-vh-100 確保高度至少跟螢幕一樣高 -->
<body class="d-flex flex-column min-vh-100 m-0">
    
    <!-- 2. Header 使用 flex-shrink-0 避免被擠壓變小 -->
    <header class="flex-shrink-0">
        {% include "includes/header.html" %}
    </header>

    <!-- 3. main-content 使用 flex-grow-1 佔滿剩餘空間，
         並用 d-flex 讓裡面的 login-container 垂直水平置中 -->
    <main class="main-content flex-grow-1 d-flex align-items-center justify-content-center">
        {% block content %}{% endblock %}
    </main>

    <!-- 4. Footer 自然會被推到最下面 -->
    <footer class="footer bg-dark text-white text-center py-3 flex-shrink-0">
        <div class="container">
            <p class="mb-0">&copy; 2025 ProgressPal Team. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
